<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YOU CAN. Support</title>
    <style>
      :root { color-scheme: dark; --bg: #0e0b14; --card: #171120; --text: rgba(255,255,255,.84); --muted: rgba(255,255,255,.62); --accent: #f24e82; --line: rgba(255,255,255,.12); }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top left, rgba(242,78,130,.18), transparent 30%), radial-gradient(circle at bottom right, rgba(86,116,255,.16), transparent 28%), var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; }
      main { width: min(640px, 100%); padding: 24px; border: 1px solid var(--line); border-radius: 22px; background: rgba(23,17,32,.88); box-shadow: 0 24px 70px rgba(0,0,0,.28); }
      .eyebrow { color: var(--accent); font-weight: 900; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 8px 0 8px; color: white; line-height: 1.05; }
      p { color: var(--muted); }
      a { color: white; }
      .button { display: inline-flex; margin-top: 10px; padding: 13px 18px; border-radius: 16px; background: linear-gradient(135deg, #f24e82, #7b61ff); color: white; font-weight: 900; letter-spacing: .06em; text-decoration: none; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">YOU CAN.</div>
      <h1>Email Support</h1>
      <p>No GitHub account is required. Tap the button to open your mail app with a ready support message.</p>
      <a class="button" href="mailto:victor.danyschuk@gmail.com?subject=YOU%20CAN.%20Support&body=App:%20YOU%20CAN.%0ADevice:%20%0AiOS%20version:%20%0AWhat%20happened:%20%0ASteps%20to%20reproduce:%20">Email Support</a>
      <p>If the button does not open your mail app, write to <a href="mailto:victor.danyschuk@gmail.com">victor.danyschuk@gmail.com</a>.</p>
    </main>
  </body>
</html>
